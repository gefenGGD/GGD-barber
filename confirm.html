<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אישור / ביטול תור — GGD Barber</title>
<link rel="icon" href="/icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{background:#151515;border:1px solid #292929;border-radius:24px;padding:32px 24px;max-width:400px;width:100%;text-align:center;}
.icon{font-size:48px;margin-bottom:14px;}
h1{font-size:20px;margin:0 0 10px;}
p{color:#aaa;line-height:1.6;font-size:14px;}
.success{color:#4ade80}
.error{color:#f87171}
a.btn{display:inline-block;margin-top:18px;background:#fff;color:#0a0a0a;padding:12px 26px;
      border-radius:12px;text-decoration:none;font-weight:800;font-size:14px;}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">⏳</div>
    <h1>מעדכן את התור...</h1>
  </div>

  <script>
    const SUPABASE_URL = "https://cgvyizfjizbnevueasbj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";

    const params = new URLSearchParams(location.search);
    const token = params.get("t");
    const action = params.get("a"); // 'confirm' | 'cancel'
    const card = document.getElementById("card");

    function render(icon, title, message, cls){
      card.innerHTML = `<div class="icon">${icon}</div><h1 class="${cls}">${title}</h1><p>${message}</p>
        <a class="btn" href="/index.html">חזרה לאתר</a>`;
    }

    async function respond(){
      if(!token || !["confirm","cancel"].includes(action)){
        render("⚠️", "קישור לא תקין", "הקישור שלחצת עליו אינו תקין.", "error");
        return;
      }
      try{
        const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/respond_to_booking", {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ p_token: token, p_action: action })
        });
        const data = await res.json();
        if(!res.ok || !data || data.success === false){
          render("⚠️", "לא ניתן לעדכן", (data && data.message) || "אירעה שגיאה, נסה שוב או צור קשר עם המספרה.", "error");
          return;
        }
        if(data.action === "confirmed"){
          render("✅", "התור אושר!", "מחכים לך, נתראה בקרוב 💈", "success");
        } else {
          render("❌", "התור בוטל", "התור בוטל בהצלחה. אפשר לקבוע תור חדש בכל עת מהאתר.", "success");
        }
      }catch(e){
        render("⚠️", "שגיאת תקשורת", "לא הצלחנו להתחבר לשרת, נסה שוב או צור קשר עם המספרה.", "error");
      }
    }

    respond();
  </script>
</body>
</html>
