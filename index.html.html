<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGD Barber — קביעת תור</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif}
.container{max-width:520px;margin:auto;padding:22px 18px 50px}.brand{text-align:center;padding:18px 0 28px}
.logo{font-size:48px;font-weight:900;letter-spacing:5px}.sub{color:#999;font-size:13px;letter-spacing:2px}
.card{background:#151515;border:1px solid #292929;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 8px 30px #0008}
h2{font-size:19px;margin:0 0 15px}.services{display:grid;gap:10px}
.service{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid #303030;border-radius:14px;cursor:pointer;transition:.2s}
.service:hover,.service.selected{border-color:#fff;background:#202020}.service small{display:block;color:#999;margin-top:4px}
.price{font-weight:bold}.dates,.times{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.date,.time{min-width:72px;padding:12px 8px;text-align:center;border:1px solid #303030;border-radius:12px;cursor:pointer}.date.selected,.time.selected{background:#fff;color:#000;border-color:#fff}.date b{display:block;font-size:18px;margin-bottom:4px}.date span{font-size:11px;color:#999}.date.selected span{color:#555}
.times{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.time{min-width:0}.time.disabled{opacity:.3;pointer-events:none;text-decoration:line-through}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #333;background:#0e0e0e;color:white;font-size:16px;margin-top:9px}
button{width:100%;padding:16px;border:0;border-radius:13px;background:#fff;color:#000;font-size:17px;font-weight:800;cursor:pointer}.summary{line-height:1.8;color:#ccc}.summary strong{color:#fff}
#success{display:none;text-align:center}.check{font-size:58px}.muted{color:#888;font-size:13px}
.nav{position:sticky;bottom:12px;background:#181818eF;border:1px solid #333;border-radius:18px;padding:10px;display:flex;justify-content:space-around;backdrop-filter:blur(12px)}.nav span{font-size:12px;color:#aaa;text-align:center}.nav span:first-child{color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="brand"><div class="logo">GGD</div><div class="sub">BARBER • BOOKING</div></div>

  <div id="booking">
    <div class="card">
      <h2>בחר שירות</h2>
      <div class="services">
        <div class="service selected" data-service="תספורת" data-price="70" onclick="selectService(this)">
          <div><b>תספורת</b><small>Fade / Classic</small></div><div class="price">₪70</div>
        </div>
        <div class="service" data-service="תספורת + זקן" data-price="90" onclick="selectService(this)">
          <div><b>תספורת + זקן</b><small>Full service</small></div><div class="price">₪90</div>
        </div>
        <div class="service" data-service="סידור זקן" data-price="40" onclick="selectService(this)">
          <div><b>סידור זקן</b><small>Beard trim</small></div><div class="price">₪40</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>בחר תאריך</h2>
      <div class="dates" id="dates"></div>
    </div>

    <div class="card">
      <h2>בחר שעה</h2>
      <div class="times" id="times"></div>
    </div>

    <div class="card">
      <h2>פרטים</h2>
      <input id="name" placeholder="שם מלא">
      <input id="phone" type="tel" placeholder="מספר טלפון">
    </div>

    <div class="card">
      <h2>סיכום</h2>
      <div class="summary" id="summary"></div>
      <br><button onclick="book()">קביעת תור</button>
    </div>
  </div>

  <div id="success" class="card">
    <div class="check">✓</div>
    <h2>התור נקבע בהצלחה!</h2>
    <div class="summary" id="successText"></div>
    <br><button onclick="resetBooking()">קביעת תור נוסף</button>
  </div>

  <div class="nav"><span>💈<br>קביעת תור</span><span>📅<br>התורים שלי</span><span>📍<br>מיקום</span></div>
</div>

<script>
let service={name:"תספורת",price:70}, selectedDate=null, selectedTime=null;
const times=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];

function selectService(el){
 document.querySelectorAll('.service').forEach(x=>x.classList.remove('selected'));
 el.classList.add('selected'); service={name:el.dataset.service,price:Number(el.dataset.price)}; update();
}
function makeDates(){
 const days=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"], d=new Date();
 for(let i=0;i<7;i++){
  let x=new Date(d);x.setDate(d.getDate()+i);
  let el=document.createElement('div');el.className='date'+(i===0?' selected':'');
  el.innerHTML=`<b>${x.getDate()}</b><span>${days[x.getDay()]}</span>`;
  el.onclick=()=>{document.querySelectorAll('.date').forEach(a=>a.classList.remove('selected'));el.classList.add('selected');selectedDate=x;renderTimes();update()};
  document.getElementById('dates').appendChild(el); if(i===0)selectedDate=x;
 }
}
function renderTimes(){
 const box=document.getElementById('times');box.innerHTML='';
 times.forEach((t,i)=>{let el=document.createElement('div');el.className='time'+(i===2||i===7?' disabled':'');el.textContent=t;el.onclick=()=>{document.querySelectorAll('.time').forEach(a=>a.classList.remove('selected'));el.classList.add('selected');selectedTime=t;update()};box.appendChild(el)})
}
function update(){
 const date=selectedDate?selectedDate.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'לא נבחר';
 document.getElementById('summary').innerHTML=`שירות: <strong>${service.name}</strong><br>תאריך: <strong>${date}</strong><br>שעה: <strong>${selectedTime||'לא נבחרה'}</strong><br>מחיר: <strong>₪${service.price}</strong>`;
}
function book(){
 const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();
 if(!name||!phone||!selectedTime){alert('צריך למלא שם, טלפון ולבחור שעה.');return}
 document.getElementById('booking').style.display='none';document.getElementById('success').style.display='block';
 const date=selectedDate.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
 document.getElementById('successText').innerHTML=`<strong>${name}</strong>, התור שלך נשמר.<br><br>${service.name}<br>${date} בשעה ${selectedTime}<br>₪${service.price}<br><br><span class="muted">${phone}</span>`;
}
function resetBooking(){location.reload()}
makeDates();renderTimes();update();
</script>
</body>
</html>
