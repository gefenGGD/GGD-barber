<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GGD Barber</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.c{max-width:520px;margin:auto;padding:20px 18px 50px}.brand{text-align:center;padding:15px 0 25px}.logo{font-size:48px;font-weight:900;letter-spacing:5px}.sub{color:#999;font-size:12px;letter-spacing:2px}.card{background:#151515;border:1px solid #292929;border-radius:20px;padding:18px;margin-bottom:15px}h2{font-size:19px;margin:0 0 15px}.services{display:grid;gap:10px}.service{display:flex;justify-content:space-between;padding:15px;border:1px solid #303030;border-radius:14px;cursor:pointer}.service.selected{border-color:#fff;background:#202020}.service small{display:block;color:#999;margin-top:4px}.dates{display:flex;gap:8px;overflow:auto}.date{min-width:72px;padding:12px 8px;text-align:center;border:1px solid #303030;border-radius:12px;cursor:pointer}.date.selected{background:#fff;color:#000}.date b{display:block;font-size:18px}.date span{font-size:11px;color:#999}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time{padding:12px;text-align:center;border:1px solid #303030;border-radius:12px;cursor:pointer}.time.selected{background:#fff;color:#000}.time.disabled{opacity:.3;pointer-events:none;text-decoration:line-through}input{width:100%;padding:15px;margin-top:9px;border-radius:12px;border:1px solid #333;background:#0e0e0e;color:#fff;font-size:16px}button{width:100%;padding:16px;border:0;border-radius:13px;background:#fff;color:#000;font-size:17px;font-weight:800}.summary{line-height:1.8;color:#ccc}.summary strong{color:#fff}.status{text-align:center;color:#999;font-size:13px;min-height:18px;margin-top:10px}.error{color:#ff8c8c}#success{display:none;text-align:center}.check{font-size:58px}.nav{position:sticky;bottom:12px;background:#181818ee;border:1px solid #333;border-radius:18px;padding:10px;display:flex;justify-content:space-around}.nav span{font-size:12px;color:#aaa;text-align:center}
</style></head><body><div class="c">
<div class="brand"><div class="logo">GGD</div><div class="sub">BARBER • BOOKING</div></div>
<div id="booking">
<div class="card"><h2>בחר שירות</h2><div class="services">
<div class="service selected" data-service="תספורת" data-price="70"><div><b>תספורת</b><small>Fade / Classic</small></div><b>₪70</b></div>
<div class="service" data-service="תספורת + זקן" data-price="90"><div><b>תספורת + זקן</b><small>Full service</small></div><b>₪90</b></div>
<div class="service" data-service="סידור זקן" data-price="40"><div><b>סידור זקן</b><small>Beard trim</small></div><b>₪40</b></div>
</div></div>
<div class="card"><h2>בחר תאריך</h2><div class="dates" id="dates"></div></div>
<div class="card"><h2>בחר שעה</h2><div class="times" id="times"></div><div id="timeStatus" class="status">טוען שעות...</div></div>
<div class="card"><h2>פרטים</h2><input id="name" placeholder="שם מלא"><input id="phone" type="tel" placeholder="מספר טלפון"></div>
<div class="card"><h2>סיכום</h2><div id="summary" class="summary"></div><br><button id="book" onclick="book()">קביעת תור</button><div id="bookStatus" class="status"></div></div>
</div>
<div id="success" class="card"><div class="check">✓</div><h2>התור נקבע בהצלחה!</h2><div id="successText" class="summary"></div><br><button onclick="location.reload()">קביעת תור נוסף</button></div>
<div class="nav"><span>💈<br>קביעת תור</span><span>📅<br>התורים שלי</span><span>📍<br>מיקום</span></div>
</div>
<script>
const URL="https://cgvyizfjizbnevueasbj.supabase.co",KEY="sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";
const db=supabase.createClient(URL,KEY);let service={name:"תספורת",price:70},date=new Date(),time=null;
const slots=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];
const iso=d=>{let m=String(d.getMonth()+1).padStart(2,"0"),x=String(d.getDate()).padStart(2,"0");return d.getFullYear()+"-"+m+"-"+x};
const pretty=d=>d.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});
document.querySelectorAll(".service").forEach(e=>e.onclick=()=>{document.querySelectorAll(".service").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");service={name:e.dataset.service,price:+e.dataset.price};update()});
for(let i=0;i<7;i++){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);let e=document.createElement("div");e.className="date"+(i?"":" selected");e.innerHTML="<b>"+d.getDate()+"</b><span>"+["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"][d.getDay()]+"</span>";e.onclick=()=>{document.querySelectorAll(".date").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");date=d;time=null;update();loadSlots()};document.getElementById("dates").appendChild(e)}
function update(){document.getElementById("summary").innerHTML="שירות: <strong>"+service.name+"</strong><br>תאריך: <strong>"+pretty(date)+"</strong><br>שעה: <strong>"+(time||"לא נבחרה")+"</strong><br>מחיר: <strong>₪"+service.price+"</strong>"}
async function loadSlots(){let box=document.getElementById("times"),st=document.getElementById("timeStatus");box.innerHTML="";st.textContent="בודק שעות פנויות...";let r=await db.rpc("get_booked_slots",{p_date:iso(date)});if(r.error){st.textContent="שגיאה בטעינת השעות";st.className="status error";return}let booked=new Set((r.data||[]).map(x=>String(x.appointment_time).slice(0,5)));slots.forEach(t=>{let e=document.createElement("div");e.className="time"+(booked.has(t)?" disabled":"");e.textContent=booked.has(t)?"תפוס":t;e.onclick=()=>{document.querySelectorAll(".time").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");time=t;update()};box.appendChild(e)});st.textContent=booked.size===slots.length?"אין שעות פנויות בתאריך הזה":"השעות הלבנות פנויות"}
async function book(){let n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.trim(),st=document.getElementById("bookStatus"),b=document.getElementById("book");if(!n||!p||!time){st.textContent="צריך למלא שם, טלפון ולבחור שעה";st.className="status error";return}b.disabled=true;b.textContent="שומר תור...";let r=await db.rpc("book_appointment",{p_customer_name:n,p_customer_phone:p,p_service:service.name,p_price:service.price,p_date:iso(date),p_time:time+":00"});b.disabled=false;b.textContent="קביעת תור";if(r.error){st.textContent="אירעה שגיאה. נסה שוב.";st.className="status error";return}if(!r.data?.success){st.textContent=r.data?.message||"השעה כבר נתפסה";st.className="status error";loadSlots();return}document.getElementById("booking").style.display="none";document.getElementById("success").style.display="block";document.getElementById("successText").innerHTML="<strong>"+n+"</strong>, התור שלך נשמר.<br><br>"+service.name+"<br>"+pretty(date)+" בשעה "+time+"<br>₪"+service.price+"<br><br>"+p}
update();loadSlots();
</script></body></html>
