<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GGD Barber — קביעת תור</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
.c{max-width:520px;margin:auto;padding:20px 18px 50px}
.brand{text-align:center;padding:15px 0 25px}.logo{font-size:48px;font-weight:900;letter-spacing:5px}.sub{color:#999;font-size:12px;letter-spacing:2px}
.card{background:#151515;border:1px solid #292929;border-radius:20px;padding:18px;margin-bottom:15px}
h2{font-size:19px;margin:0 0 15px}.services{display:grid;gap:10px}
.service{display:flex;justify-content:space-between;padding:15px;border:1px solid #303030;border-radius:14px;cursor:pointer;transition:.15s}
.service.selected{border-color:#fff;background:#202020}
.service small{display:block;color:#999;margin-top:4px}.dates{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.date{min-width:72px;padding:12px 8px;text-align:center;border:1px solid #303030;border-radius:12px;cursor:pointer}
.date.selected{background:#fff;color:#000}.date b{display:block;font-size:18px;margin-bottom:4px}.date span{font-size:11px;color:#999}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{padding:12px;text-align:center;border:1px solid #303030;border-radius:12px;cursor:pointer}
.time.selected{background:#fff;color:#000}.time.disabled{opacity:.3;pointer-events:none;text-decoration:line-through}
input{width:100%;padding:15px;margin-top:9px;border-radius:12px;border:1px solid #333;background:#0e0e0e;color:#fff;font-size:16px}
button{width:100%;padding:16px;border:0;border-radius:13px;background:#fff;color:#000;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.55}.summary{line-height:1.8;color:#ccc}.summary strong{color:#fff}
.status{text-align:center;color:#999;font-size:13px;min-height:18px;margin-top:10px}.error{color:#ff8c8c}
#success{display:none;text-align:center}.check{font-size:58px}
.nav{position:sticky;bottom:12px;background:#181818ee;border:1px solid #333;border-radius:18px;padding:10px;display:flex;justify-content:space-around}
.nav span{font-size:12px;color:#aaa;text-align:center}.nav span:first-child{color:#fff}
</style>
</head>
<body>
<div class="c">
<div class="brand"><div class="logo">GGD</div><div class="sub">BARBER • BOOKING</div></div>

<div id="booking">
<div class="card"><h2>בחר שירות</h2><div class="services">
<div class="service selected" data-service="תספורת" data-price="70"><div><b>תספורת</b><small>Fade / Classic</small></div><b>₪70</b></div>
<div class="service" data-service="תספורת + זקן" data-price="90"><div><b>תספורת + זקן</b><small>Full service</small></div><b>₪90</b></div>
<div class="service" data-service="סידור זקן" data-price="40"><div><b>סידור זקן</b><small>Beard trim</small></div><b>₪40</b></div>
</div></div>

<div class="card"><h2>בחר תאריך</h2><div class="dates" id="dates"></div></div>

<div class="card"><h2>בחר שעה</h2><div class="times" id="times"></div><div id="timeStatus" class="status">טוען שעות...</div></div>

<div class="card"><h2>פרטים</h2><input id="name" placeholder="שם מלא" autocomplete="name"><input id="phone" type="tel" placeholder="מספר טלפון" autocomplete="tel"></div>

<div class="card"><h2>סיכום</h2><div id="summary" class="summary"></div><br><button id="book" type="button">קביעת תור</button><div id="bookStatus" class="status"></div></div>
</div>

<div id="success" class="card"><div class="check">✓</div><h2>התור נקבע בהצלחה!</h2><div id="successText" class="summary"></div><br><button type="button" onclick="location.reload()">קביעת תור נוסף</button></div>

<div class="nav"><span>💈<br>קביעת תור</span><span>📅<br>התורים שלי</span><span>📍<br>מיקום</span></div>
</div>

<script>
const SUPABASE_URL="https://cgvyizfjizbnevueasbj.supabase.co";
const SUPABASE_KEY="sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";

let service={name:"תספורת",price:70};
let selectedDate=new Date();
selectedDate.setHours(0,0,0,0);
let selectedTime=null;

const slots=["09:00","09:30","10:00","10:30","11:00","11:30","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];

function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function pretty(d){return d.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});}
function rpc(name,body){
  return fetch(SUPABASE_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(body)
  }).then(async r=>{
    const text=await r.text();
    let data=null; try{data=text?JSON.parse(text):null}catch(e){}
    if(!r.ok) throw new Error(data?.message||data?.hint||text||("HTTP "+r.status));
    return data;
  });
}

function setupServices(){
  document.querySelectorAll(".service").forEach(el=>{
    el.addEventListener("click",()=>{
      document.querySelectorAll(".service").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
      service={name:el.dataset.service,price:Number(el.dataset.price)};
      updateSummary();
    });
  });
}

function setupDates(){
  const box=document.getElementById("dates"), days=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
  box.innerHTML="";
  const now=new Date();
  now.setHours(0,0,0,0);
  for(let i=0;i<7;i++){
    const d=new Date(now);
    d.setDate(now.getDate()+i);
    const el=document.createElement("div");
    el.className="date"+(i===0?" selected":"");
    el.innerHTML="<b>"+d.getDate()+"</b><span>"+days[d.getDay()]+"</span>";
    el.addEventListener("click",async()=>{
      document.querySelectorAll(".date").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
      selectedDate=d;
      selectedTime=null;
      updateSummary();
      await loadSlots();
    });
    box.appendChild(el);
  }
}

async function loadSlots(){
  const box=document.getElementById("times"), status=document.getElementById("timeStatus");
  box.innerHTML="";
  status.className="status";
  status.textContent="בודק שעות פנויות...";
  try{
    const data=await rpc("get_booked_slots",{p_date:iso(selectedDate)});
    const booked=new Set((data||[]).map(x=>String(x.appointment_time).slice(0,5)));
    slots.forEach(t=>{
      const el=document.createElement("div");
      const taken=booked.has(t);
      el.className="time"+(taken?" disabled":"");
      el.textContent=taken?"תפוס":t;
      if(!taken) el.addEventListener("click",()=>{
        document.querySelectorAll(".time").forEach(x=>x.classList.remove("selected"));
        el.classList.add("selected");
        selectedTime=t;
        updateSummary();
      });
      box.appendChild(el);
    });
    status.textContent=booked.size===slots.length?"אין שעות פנויות בתאריך הזה":"השעות הלבנות פנויות";
  }catch(err){
    console.error(err);
    status.textContent="לא הצלחנו לטעון שעות. נסה לרענן.";
    status.className="status error";
  }
}

function updateSummary(){
  document.getElementById("summary").innerHTML=
    "שירות: <strong>"+service.name+"</strong><br>"+
    "תאריך: <strong>"+pretty(selectedDate)+"</strong><br>"+
    "שעה: <strong>"+(selectedTime||"לא נבחרה")+"</strong><br>"+
    "מחיר: <strong>₪"+service.price+"</strong>";
}

async function book(){
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const status=document.getElementById("bookStatus");
  const btn=document.getElementById("book");
  status.textContent=""; status.className="status";
  if(!name||!phone||!selectedTime){
    status.textContent="צריך למלא שם, טלפון ולבחור שעה.";
    status.className="status error"; return;
  }
  btn.disabled=true; btn.textContent="שומר תור...";
  try{
    const data=await rpc("book_appointment",{
      p_customer_name:name,
      p_customer_phone:phone,
      p_service:service.name,
      p_price:service.price,
      p_date:iso(selectedDate),
      p_time:selectedTime+":00"
    });
    if(!data?.success){
      status.textContent=data?.message||"השעה כבר נתפסה.";
      status.className="status error";
      await loadSlots(); return;
    }
    document.getElementById("booking").style.display="none";
    document.getElementById("success").style.display="block";
    document.getElementById("successText").innerHTML=
      "<strong>"+name+"</strong>, התור שלך נשמר.<br><br>"+
      service.name+"<br>"+pretty(selectedDate)+" בשעה "+selectedTime+"<br>₪"+service.price+
      "<br><br>"+phone;
  }catch(err){
    console.error(err);
    status.textContent="אירעה שגיאה בחיבור למערכת. נסה שוב.";
    status.className="status error";
  }finally{
    btn.disabled=false; btn.textContent="קביעת תור";
  }
}

document.getElementById("book").addEventListener("click",book);
setupServices();
setupDates();
updateSummary();
loadSlots();
</script>
</body>
</html>
