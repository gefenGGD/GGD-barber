<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGD Barber - קביעת תור</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:520px;
  margin:auto;
  padding:22px 16px 100px;
}

.brand{
  text-align:center;
  padding:28px 0 32px;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:12px;
}

.sub{
  color:#999;
  font-size:13px;
  letter-spacing:4px;
  margin-top:8px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h2{
  margin:0 0 18px;
  font-size:22px;
}

.services{
  display:grid;
  gap:10px;
}

.service{
  background:#191919;
  border:1px solid #303030;
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  transition:.15s;
}

.service:hover{

}

.service.selected{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.service-name{
  font-size:17px;
  font-weight:700;
}

.service-description{
  color:#999;
  font-size:13px;
  margin-top:5px;
}

.service.selected .service-description{
  color:#555;
}

.price{
  font-weight:800;
  font-size:17px;
  margin-top:8px;
}

.dates{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.date{
  background:#191919;
  border:1px solid #303030;
  border-radius:14px;
  padding:13px 7px;
  text-align:center;
  cursor:pointer;
}

.date.selected{
  background:#fff;
  color:#000;
}

.date.disabled{
  opacity:.3;
  cursor:not-allowed;
}

.day{
  font-size:13px;
  color:#999;
}

.date.selected .day{
  color:#555;
}

.date-number{
  font-size:19px;
  font-weight:800;
  margin-top:3px;
}

.times{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.time{
  padding:13px 5px;
  text-align:center;
  border:1px solid #303030;
  border-radius:12px;
  background:#191919;
  cursor:pointer;
}

.time.selected{
  background:#fff;
  color:#000;
}

.time.disabled{
  opacity:.3;
  cursor:not-allowed;
  text-decoration:line-through;
}

input{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #333;
  background:#101010;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#888;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#fff;
  color:#000;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.status{
  text-align:center;
  color:#999;
  margin-top:12px;
  line-height:1.5;
}

.error{
  color:#ff6b6b;
}

.success{
  text-align:center;
}

.success-icon{
  font-size:45px;
  margin-bottom:10px;
}

.summary{
  background:#101010;
  border-radius:15px;
  padding:15px;
  margin:15px 0;
  line-height:1.9;
}

.nav{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(490px,calc(100% - 24px));
  background:#181818;
  border:1px solid #303030;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:10px;
  z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.nav span{
  text-align:center;
  color:#aaa;
  font-size:12px;
}

.nav b{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.hidden{
  display:none!important;
}

.loading{
  color:#888;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">GGD</div>
    <div class="sub">BARBER • BOOKING</div>
  </div>

  <div id="booking">

    <div class="card">
      <h2>בחר שירות</h2>
      <div id="services" class="services">
        <div class="loading">טוען שירותים...</div>
      </div>
    </div>

    <div class="card">
      <h2>בחר תאריך</h2>
      <div id="dates" class="dates">
        <div class="loading">טוען תאריכים...</div>
      </div>
    </div>

    <div class="card">
      <h2>בחר שעה</h2>
      <div id="times" class="times">
        <div class="loading">בחר תאריך...</div>
      </div>
      <div id="timeStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>פרטים</h2>

      <input id="name" type="text" placeholder="שם מלא">

      <input id="phone" type="tel" placeholder="מספר טלפון">

      <div style="margin-top:15px">
        <button id="book" disabled>קביעת תור</button>
      </div>

      <div id="status" class="status"></div>
    </div>

  </div>

  <div id="success" class="card success hidden">
    <div class="success-icon">✓</div>
    <h2>התור נקבע בהצלחה!</h2>

    <div id="successText" class="summary"></div>

    <button onclick="location.reload()">קביעת תור נוסף</button>
  </div>

</div>

<div class="nav">

  <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Tsur+St,+Eilat','_blank')">
    <b>📍</b>
    מיקום
  </button>

  <button onclick="showMyBooking()">
    <b>📅</b>
    התור שלי
  </button>

  <button onclick="window.open('https://www.instagram.com/gefen.ganon/','_blank')">
  <b>📸</b>
  אינסטגרם
</button>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cgvyizfjizbnevueasbj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";


/* =========================
   VARIABLES
========================= */

let services = [];
let workingHours = [];

let selectedService = null;
let selectedDate = null;
let selectedTime = null;


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseFetch(path, options = {}) {
  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 10000);

  try {
    const response = await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        signal: controller.signal,
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    if (!response.ok) {
      const text = await response.text();

      throw new Error(
        "Supabase error: " +
        response.status +
        " " +
        text
      );
    }

    return response.json();

  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("Supabase לא הגיב תוך 10 שניות");
    }

    throw error;

  } finally {
    clearTimeout(timeout);
  }
}



/* =========================
   LOAD SERVICES
========================= */

async function loadServices(){

  const box = document.getElementById("services");

  try{

    const data = await supabaseFetch(
  "/rest/v1/rpc/get_active_services",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({})
  }
);

    /*
      במקרה שנוצרו כפילויות בטבלה,
      נציג כל שירות פעם אחת בלבד.
    */

    const unique = [];

    const names = new Set();

    for(const service of data){

      if(!names.has(service.name)){

        names.add(service.name);
        unique.push(service);

      }

    }

    services = unique;

    if(!services.length){

      box.innerHTML =
        '<div class="status error">לא נמצאו שירותים</div>';

      return;
    }

    box.innerHTML = "";

    services.forEach(service => {

      const el = document.createElement("div");

      el.className = "service";

      el.innerHTML = `
        <div class="service-name">
          ${escapeHtml(service.name)}
        </div>

        <div class="service-description">
          ${escapeHtml(service.description || "")}
        </div>

        <div class="price">
          ₪${Number(service.price).toFixed(0)}
        </div>
      `;

      el.onclick = () => {

        document
          .querySelectorAll(".service")
          .forEach(x => x.classList.remove("selected"));

        el.classList.add("selected");

        selectedService = service;
        selectedTime = null;

        updateBookButton();

        if(selectedDate){
          loadSlots();
        }

      };

      box.appendChild(el);

    });

  }catch(error){

    console.error(error);
alert(error.message);

    box.innerHTML =
      '<div class="status error">לא הצלחנו לטעון את השירותים</div>';
  }
}


/* =========================
   LOAD WORKING HOURS
========================= */

async function loadWorkingHours(){

  try{

    workingHours = await supabaseFetch(
      "/rest/v1/working_hours?select=day_of_week,day_name,is_open,open_time,close_time,break_start,break_end,slot_duration&is_open=eq.true&order=day_of_week"
    );

    renderDates();

  }catch(error){

    console.error(error);

    document.getElementById("dates").innerHTML =
      '<div class="status error">לא הצלחנו לטעון את שעות העבודה</div>';

  }
}


/* =========================
   DATES
========================= */

function renderDates(){

  const box = document.getElementById("dates");

  box.innerHTML = "";

  const today = new Date();

  today.setHours(0,0,0,0);

  /*
    מציג 21 ימים קדימה
  */

  for(let i=0;i<21;i++){

    const date = new Date(today);

    date.setDate(today.getDate() + i);

    const dayOfWeek = date.getDay();

    const hours = workingHours.find(
      x => Number(x.day_of_week) === dayOfWeek
    );

    if(!hours || !hours.is_open){

      continue;
    }

    const el = document.createElement("div");

    el.className = "date";

    const dayNames = [
      "ראשון",
      "שני",
      "שלישי",
      "רביעי",
      "חמישי",
      "שישי",
      "שבת"
    ];

    el.innerHTML = `
      <div class="day">
        ${dayNames[dayOfWeek]}
      </div>

      <div class="date-number">
        ${date.getDate()}/${date.getMonth()+1}
      </div>
    `;

    el.onclick = () => {

      document
        .querySelectorAll(".date")
        .forEach(x => x.classList.remove("selected"));

      el.classList.add("selected");

      selectedDate = date;
      selectedTime = null;

      updateBookButton();
      loadSlots();

    };

    box.appendChild(el);

  }

}


/* =========================
   LOAD BOOKED SLOTS
========================= */

async function getBookedSlots(date){

  const dateString = isoDate(date);

  try{

    const data = await supabaseFetch(
      "/rest/v1/rpc/get_booked_slots",
      {
        method:"POST",
        body:JSON.stringify({
          p_date:dateString
        })
      }
    );

    return Array.isArray(data) ? data : [];

  }catch(error){

    console.error(error);

    return [];

  }
}


/* =========================
   CREATE TIME SLOTS
========================= */

async function loadSlots(){

  const box = document.getElementById("times");

  const status = document.getElementById("timeStatus");

  box.innerHTML =
    '<div class="loading">טוען שעות...</div>';

  status.textContent = "";

  if(!selectedDate){

    box.innerHTML =
      '<div class="status">בחר תאריך</div>';

    return;
  }

  const dayOfWeek = selectedDate.getDay();

  const hours = workingHours.find(
    x => Number(x.day_of_week) === dayOfWeek
  );

  if(!hours){

    box.innerHTML =
      '<div class="status">אין שעות עבודה ביום הזה</div>';

    return;
  }

  const booked = await getBookedSlots(selectedDate);

  const bookedSet = new Set();

  booked.forEach(item => {

    if(typeof item === "string"){

      bookedSet.add(item.slice(0,5));

    }else if(item && item.time){

      bookedSet.add(String(item.time).slice(0,5));

 

  });


  const slots = generateSlots(
    hours.open_time,
    hours.close_time,
    hours.break_start,
    hours.break_end,
    Number(hours.slot_duration || 30)
  );
const availableSlots = slots.filter(time => !bookedSet.has(String(time).slice(0,5)));

  box.innerHTML = "";

  if(!availableSlots.length){

    box.innerHTML =
      '<div class="status">אין שעות זמינות</div>';

    return;
  }


availableSlots.forEach(time => {
if (bookedSet.has(String(time).slice(0,5))) return;
    const el = document.createElement("div");

    const isBooked = bookedSet.has(time);

    el.className =
      "time" + (isBooked ? " disabled" : "");

    el.textContent =
      isBooked ? "תפוס" : time;


    if(!isBooked){

      el.onclick = () => {

        document
          .querySelectorAll(".time")
          .forEach(x => x.classList.remove("selected"));

        el.classList.add("selected");

        selectedTime = time;

        updateBookButton();

      };

    }

    box.appendChild(el);

  });

}


/* =========================
   GENERATE SLOTS
========================= */

function generateSlots(
  openTime,
  closeTime,
  breakStart,
  breakEnd,
  duration
){

  const result = [];

  let current = timeToMinutes(openTime);

  const close = timeToMinutes(closeTime);

  const breakFrom =
    breakStart ? timeToMinutes(breakStart) : null;

  const breakTo =
    breakEnd ? timeToMinutes(breakEnd) : null;


  while(current + duration <= close){

    const end = current + duration;

    /*
      לא מאפשר תור שחופף להפסקה
    */

    const overlapsBreak =
      breakFrom !== null &&
      breakTo !== null &&
      current < breakTo &&
      end > breakFrom;

    if(!overlapsBreak){

      result.push(minutesToTime(current));

    }

    current += duration;

  }

  return result;
}


/* =========================
   BOOK
========================= */

document
  .getElementById("book")
  .addEventListener("click", bookAppointment);


async function bookAppointment(){

  const button =
    document.getElementById("book");

  const status =
    document.getElementById("status");

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();


  if(!selectedService ||
     !selectedDate ||
     !selectedTime){

    status.textContent =
      "בחר שירות, תאריך ושעה";

    status.className =
      "status error";

    return;
  }


  if(!name){

    status.textContent =
      "נא להזין שם";

    status.className =
      "status error";

    return;
  }


  if(!phone){

    status.textContent =
      "נא להזין מספר טלפון";

    status.className =
      "status error";

    return;
  }


  button.disabled = true;
  button.textContent = "קובע תור...";

  status.textContent = "";


  try{

    const result = await supabaseFetch(
      "/rest/v1/rpc/book_slot",
      {
        method:"POST",

        body:JSON.stringify({

          p_service_id:selectedService.id,

          p_name:name,

          p_phone:phone,

          p_date:isoDate(selectedDate),

          p_time:selectedTime + ":00"

        })
      }
    );


    /*
      הפונקציה שלנו מחזירה JSON
      עם success/message
    */

    if(result && result.success === false){

      throw new Error(
        result.message || "לא ניתן לקבוע את התור"
      );

    }

localStorage.setItem("myBooking", JSON.stringify({
  name: name,
  service: selectedService.name,
  date: selectedDate,
  time: selectedTime,
  price: selectedService.price,
  phone: phone
}));
    document
      .getElementById("booking")
      .classList.add("hidden");


    const success =
      document.getElementById("success");

    success.classList.remove("hidden");


    document
      .getElementById("successText")
      .innerHTML = `

        <strong>${escapeHtml(name)}</strong>

        <br>

        ${escapeHtml(selectedService.name)}

        <br>

        ${formatDate(selectedDate)}

        <br>

        שעה: <strong>${selectedTime}</strong>

        <br>

        מחיר: ₪${Number(selectedService.price).toFixed(0)}

        <br><br>

        הטלפון שלך: ${escapeHtml(phone)}

      `;


  }catch(error){

    console.error(error);

    status.textContent =
      error.message ||
      "אירעה שגיאה בקביעת התור";

    status.className =
      "status error";

    button.disabled = false;
    button.textContent = "קביעת תור";

    /*
      מרעננים את השעות במקרה
      שמישהו תפס את השעה לפנינו.
    */

    await loadSlots();

  }

}


/* =========================
   BUTTON STATE
========================= */

function updateBookButton(){

  const button =
    document.getElementById("book");

  button.disabled =
    !selectedService ||
    !selectedDate ||
    !selectedTime;

}


/* =========================
   HELPERS
========================= */

function isoDate(date){

  const y = date.getFullYear();

  const m = String(date.getMonth()+1)
    .padStart(2,"0");

  const d = String(date.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function formatDate(date){
    const d = new Date(date);

    return d.toLocaleDateString(
        "he-IL",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );
}

function timeToMinutes(value){

  const parts =
    String(value).slice(0,5).split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


function minutesToTime(minutes){

  const h =
    Math.floor(minutes / 60);

  const m =
    minutes % 60;

  return (
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0")
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

async function init(){

    loadServices();
    loadWorkingHours();

}
init();
function showMyBooking(){
  const saved = localStorage.getItem("myBooking");

  if(!saved){
    alert("אין כרגע תור שמור");
    return;
  }

  let data;

  try{
    data = JSON.parse(saved);
  }catch(e){
    alert("לא ניתן לקרוא את פרטי התור");
    return;
  }

  const success = document.getElementById("success");

  if(!success){
    alert("לא נמצא אזור התור");
    return;
  }

  success.classList.remove("hidden");

  document.getElementById("successText").innerHTML = `
    <strong>${escapeHtml(data.name || "")}</strong>
    <br><br>
    ${escapeHtml(data.service || "")}
    <br><br>
    ${formatDate(data.date)}
    <br><br>
    שעה: <strong>${escapeHtml(data.time || "")}</strong>
    <br><br>
    מחיר: ₪${Number(data.price || 0).toFixed(0)}
    <br><br>
    הטלפון שלך: ${escapeHtml(data.phone || "")}
  `;

setTimeout(() => {
    success.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}, 100);
}
</script>
