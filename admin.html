<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGD Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  width:min(900px,calc(100% - 30px));
  margin:40px auto;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:10px;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#888;
  letter-spacing:4px;
  margin-bottom:35px;
}

.card{
  background:#151515;
  border:1px solid #2b2b2b;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #333;
  background:#0d0d0d;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

button:disabled{
  opacity:.5;
}

.logout{
  background:#222;
  color:#fff;
}

.status{
  margin-top:12px;
  text-align:center;
  color:#aaa;
}

.error{
  color:#ff6868;
}

.success{
  color:#6ee79b;
}

.booking{
  background:#0e0e0e;
  border:1px solid #2d2d2d;
  border-radius:15px;
  padding:16px;
  margin-top:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #252525;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#888;
}

.value{
  font-weight:bold;
}

.delete{
  background:#9e2020;
  color:#fff;
}

.hidden{
  display:none;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 0;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">GGD</div>
  <div class="subtitle">BARBER • ADMIN</div>


  <!-- LOGIN -->

  <div id="loginCard" class="card">

    <h2>🔐 כניסת מנהל</h2>

    <input
      id="email"
      type="email"
      placeholder="אימייל"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="סיסמה"
      autocomplete="current-password"
    >

    <button onclick="login()">
      כניסה
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel" class="hidden">

    <div class="card">

      <h2>📅 ניהול תורים</h2>

      <button onclick="loadBookings()">
        🔄 רענן תורים
      </button>

      <button
        class="logout"
        onclick="logout()">
        יציאה
      </button>

      <div id="bookingStatus" class="status">
        טוען...
      </div>

    </div>


    <div id="bookings"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cgvyizfjizbnevueasbj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";


/* =========================
   SUPABASE REQUEST
========================= */

async function request(path,options={}){

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,

      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data=null;

  try{
    data=text ? JSON.parse(text) : null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      response.status + " " + text
    );

  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");


  if(!email || !password){

    status.textContent =
      "נא למלא אימייל וסיסמה";

    status.className =
      "status error";

    return;
  }


  status.textContent =
    "מתחבר...";

  status.className =
    "status";


  try{

    const data = await request(
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );


    localStorage.setItem(
      "ggd_access_token",
      data.access_token
    );

    localStorage.setItem(
      "ggd_refresh_token",
      data.refresh_token
    );


    showAdmin();


  }catch(error){

    console.error(error);

    status.textContent =
      "אימייל או סיסמה שגויים";

    status.className =
      "status error";

  }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  loadBookings();

}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings(){

  const box =
    document.getElementById("bookings");

  const status =
    document.getElementById("bookingStatus");


  box.innerHTML="";

  status.textContent =
    "טוען תורים...";


  const token =
    localStorage.getItem("ggd_access_token");


  if(!token){

    logout();

    return;
  }


  try{

    const data = await request(
      "/rest/v1/bookings?select=*&order=booking_date.asc,booking_time.asc",
      {
        headers:{
          "Authorization":
            "Bearer " + token
        }
      }
    );


    if(!data || !data.length){

      status.textContent =
        "אין כרגע תורים";

      box.innerHTML =
        '<div class="card empty">אין תורים להצגה</div>';

      return;
    }


    status.textContent =
      "נמצאו " + data.length + " תורים";


    data.forEach(booking=>{

      const item =
        document.createElement("div");

      item.className =
        "card booking";


      item.innerHTML = `

        <div class="row">
          <span class="label">👤 לקוח</span>
          <span class="value">
            ${escapeHtml(
              booking.customer_name || ""
            )}
          </span>
        </div>

        <div class="row">
          <span class="label">📞 טלפון</span>
          <span class="value">
            ${escapeHtml(
              booking.phone || ""
            )}
          </span>
        </div>

        <div class="row">
          <span class="label">💈 שירות</span>
          <span class="value">
            ${escapeHtml(
              booking.service_name || ""
            )}
          </span>
        </div>

        <div class="row">
          <span class="label">📅 תאריך</span>
          <span class="value">
            ${escapeHtml(
              booking.booking_date || ""
            )}
          </span>
        </div>

        <div class="row">
          <span class="label">🕐 שעה</span>
          <span class="value">
            ${escapeHtml(
              booking.booking_time || ""
            )}
          </span>
        </div>

        <div class="row">
          <span class="label">⏱️ משך</span>
          <span class="value">
            ${escapeHtml(
              booking.duration_minutes || 30
            )} דקות
          </span>
        </div>

        <button
          class="delete"
          onclick="deleteBooking(${booking.id})">
          🗑️ מחק תור
        </button>

      `;


      box.appendChild(item);

    });


  }catch(error){

    console.error(error);

    status.textContent =
      "שגיאה בטעינת התורים";

    status.className =
      "status error";

    box.innerHTML =
      `<div class="card error">
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   DELETE BOOKING
========================= */

async function deleteBooking(id){

  if(!confirm("למחוק את התור?")){
    return;
  }


  const token =
    localStorage.getItem("ggd_access_token");


  try{

    await request(
      "/rest/v1/bookings?id=eq." + id,
      {
        method:"DELETE",

        headers:{
          "Authorization":
            "Bearer " + token
        }
      }
    );


    await loadBookings();


  }catch(error){

    alert(
      "לא הצלחנו למחוק את התור:\n" +
      error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "ggd_access_token"
  );

  localStorage.removeItem(
    "ggd_refresh_token"
  );

  location.reload();

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

const savedToken =
  localStorage.getItem("ggd_access_token");

if(savedToken){

  showAdmin();

}

</script>

</body>
</html>
