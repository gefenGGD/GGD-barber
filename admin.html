<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GGD Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:25px 20px;
  border-bottom:1px solid #222;
  background:#0d0d0d;
}

.logo{
  font-size:30px;
  font-weight:bold;
  letter-spacing:8px;
}

.subtitle{
  color:#888;
  margin-top:5px;
  letter-spacing:3px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#141414;
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.card h2{
  margin-top:0;
  font-size:22px;
}

button{
  background:#fff;
  color:#000;
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

.refresh{
  margin-bottom:20px;
}

.status{
  padding:14px;
  border-radius:10px;
  background:#101010;
  color:#aaa;
  margin-bottom:15px;
}

.error{
  color:#ff6262;
}

.success{
  color:#61e294;
}

.item{
  background:#0e0e0e;
  border:1px solid #292929;
  border-radius:12px;
  padding:15px;
  margin-top:10px;
}

.item strong{
  font-size:18px;
}

.small{
  color:#888;
  margin-top:5px;
}

.empty{
  color:#777;
  padding:15px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">GGD</div>
  <div class="subtitle">BARBER • ADMIN</div>
</header>

<div class="container">

  <button class="refresh" onclick="loadAll()">
    🔄 רענן נתונים
  </button>

  <div id="status" class="status">
    מתחבר ל-Supabase...
  </div>

  <!-- APPOINTMENTS -->
  <div class="card">
    <h2>📅 תורים</h2>
    <div id="appointments">
      טוען תורים...
    </div>
  </div>

  <!-- SERVICES -->
  <div class="card">
    <h2>💈 שירותים</h2>
    <div id="services">
      טוען שירותים...
    </div>
  </div>

  <!-- WORKING HOURS -->
  <div class="card">
    <h2>🕐 שעות עבודה</h2>
    <div id="hours">
      טוען שעות עבודה...
    </div>
  </div>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://cgvyizfjizbnevueasbj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kQ5lsDDPA1FaXH0szLBlyw_H2U9qrQ9";


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseFetch(path, options = {}){

  const response = await fetch(
    SUPABASE_URL + path,
    {
      ...options,

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    throw new Error(
      "Supabase error: " +
      response.status +
      " " +
      text
    );
  }

  return data;
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type=""){

  const el=document.getElementById("status");

  el.textContent=text;

  el.className="status "+type;
}


/* =====================================================
   LOAD SERVICES
===================================================== */

async function loadServices(){

  const box=document.getElementById("services");

  try{

    const data=await supabaseFetch(
      "/rest/v1/rpc/get_active_services",
      {
        method:"POST",
        body:JSON.stringify({})
      }
    );

    if(!data || !data.length){

      box.innerHTML=
        '<div class="empty">אין שירותים פעילים</div>';

      return;
    }

    box.innerHTML="";

    data.forEach(service=>{

      const item=document.createElement("div");

      item.className="item";

      item.innerHTML=`
        <strong>${escapeHtml(service.name || "")}</strong>
        <div class="small">
          ${escapeHtml(service.description || "")}
        </div>
        <div class="small">
          מחיר: ₪${Number(service.price || 0).toFixed(0)}
        </div>
      `;

      box.appendChild(item);

    });

  }catch(error){

    console.error(error);

    box.innerHTML=
      '<div class="error">לא הצלחנו לטעון את השירותים</div>';

  }

}


/* =====================================================
   LOAD APPOINTMENTS
===================================================== */

async function loadAppointments(){

  const box=document.getElementById("appointments");

  try{

    const data=await supabaseFetch(
      "/rest/v1/appointments?select=*&order=date.asc,time.asc"
    );

    if(!data || !data.length){

      box.innerHTML=
        '<div class="empty">אין תורים כרגע</div>';

      return;
    }

    box.innerHTML="";

    data.forEach(appointment=>{

      const item=document.createElement("div");

      item.className="item";

      item.innerHTML=`

        <strong>
          ${escapeHtml(
            appointment.full_name ||
            appointment.name ||
            "לקוח"
          )}
        </strong>

        <div class="small">
          📅 ${escapeHtml(
            appointment.date || ""
          )}
        </div>

        <div class="small">
          🕐 ${escapeHtml(
            appointment.time || ""
          )}
        </div>

        <div class="small">
          📱 ${escapeHtml(
            appointment.phone || ""
          )}
        </div>

      `;

      box.appendChild(item);

    });

  }catch(error){

    console.error(error);

    box.innerHTML=
      '<div class="error">לא הצלחנו לטעון את התורים</div>';

  }

}


/* =====================================================
   LOAD WORKING HOURS
===================================================== */

async function loadHours(){

  const box=document.getElementById("hours");

  try{

    const data=await supabaseFetch(
      "/rest/v1/working_hours?select=*&order=day.asc"
    );

    if(!data || !data.length){

      box.innerHTML=
        '<div class="empty">לא נמצאו שעות עבודה</div>';

      return;
    }

    box.innerHTML="";

    data.forEach(hour=>{

      const item=document.createElement("div");

      item.className="item";

      item.innerHTML=`

        <strong>
          ${escapeHtml(
            hour.day_name ||
            hour.day ||
            ""
          )}
        </strong>

        <div class="small">
          ${escapeHtml(
            hour.open_time ||
            hour.start_time ||
            ""
          )}
          -
          ${escapeHtml(
            hour.close_time ||
            hour.end_time ||
            ""
          )}
        </div>

      `;

      box.appendChild(item);

    });

  }catch(error){

    console.error(error);

    box.innerHTML=
      '<div class="error">לא הצלחנו לטעון את שעות העבודה</div>';

  }

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadAll(){

  setStatus("טוען נתונים...");

  await Promise.allSettled([
    loadServices(),
    loadAppointments(),
    loadHours()
  ]);

  setStatus(
    "הנתונים נטענו",
    "success"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

loadAll();

</script>

</body>
</html>
